---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stratum-dashboard-admin
  namespace: stratum-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stratum-dashboard-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: stratum-dashboard-admin
  namespace: stratum-dashboard
---
apiVersion: v1
kind: Secret
metadata:
  name: stratum-dashboard-admin-token
  namespace: stratum-dashboard
  annotations:
    kubernetes.io/service-account.name: stratum-dashboard-admin
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stratum-dashboard-viewer
  namespace: stratum-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stratum-dashboard-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: stratum-dashboard-viewer
  namespace: stratum-dashboard
---
apiVersion: v1
kind: Secret
metadata:
  name: stratum-dashboard-viewer-token
  namespace: stratum-dashboard
  annotations:
    kubernetes.io/service-account.name: stratum-dashboard-viewer
type: kubernetes.io/service-account-token
