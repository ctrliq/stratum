apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:coredns
rules:
- apiGroups: [""]
  resources: ["endpoints", "services", "pods", "namespaces"]
  verbs: ["list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:coredns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:coredns
subjects:
- kind: ServiceAccount
  name: coredns
  namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  # Names outside the cluster go to the node's own resolvers, as the upstream
  # Kubernetes default does, so private zones, split-horizon and site DNS
  # resolve in pods as they do on the node. The file is the
  # upstream-resolv init container's copy: the node's choice
  # (internal/runtime.WriteCoreDNSUpstream) when it made one, else this pod's
  # /etc/resolv.conf, which dnsPolicy Default makes the node's.
  Corefile: |
    .:53 {
        errors
        health
        ready
        kubernetes __STRATUM_CLUSTER_DOMAIN__ in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        prometheus :9153
        forward . /etc/coredns-upstream/resolv.conf {
            max_concurrent 1000
        }
        cache 30
        loop
        reload
        loadbalance
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
spec:
  replicas: 2
  selector:
    matchLabels:
      k8s-app: kube-dns
  template:
    metadata:
      labels:
        k8s-app: kube-dns
    spec:
      serviceAccountName: coredns
      # Critical priority is what protects CoreDNS under DiskPressure: the
      # kubelet refuses node-pressure eviction of critical pods, even once
      # lower-priority pods are gone, and still admits them.
      priorityClassName: system-cluster-critical
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  k8s-app: kube-dns
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
      # Replace a replica on a dead node after 30 s instead of the default 300 s,
      # so a second node failure within five minutes of the first does not find
      # both replicas stranded. The default tolerations are added automatically
      # at 300 s; these override them.
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
      # A node that has not written its upstream (one not yet upgraded, or
      # one racing its first start) leaves the directory empty. The init
      # container then makes the choice the node would have made, by the
      # rules of internal/runtime.chooseCoreDNSUpstream: the pod's
      # /etc/resolv.conf (the node's, under dnsPolicy Default) with the
      # nameservers a pod cannot reach left out, else the node's
      # systemd-resolved upstream file, else the public pair. Copying the
      # node's file whole forwarded to systemd-resolved's 127.0.0.53 stub, which
      # from inside the pod is CoreDNS itself, and the loop plugin stopped it.
      # Never a missing or empty file, which forward would refuse.
      initContainers:
      - name: upstream-resolv
        image: __STRATUM_BUSYBOX_IMAGE__
        command:
        - /bin/sh
        - -c
        - |
          out=/upstream/resolv.conf
          keep() { grep -E '^(search|domain|options)[[:space:]]' "$1" 2>/dev/null || true; }
          # CNI assigns pod addresses before init runs. Check this namespace,
          # not the node's IPv6 capability, when choosing a native IPv6 server.
          pod_ipv6=0
          if awk '$4 == "00" && $6 != "lo" { found = 1; exit } END { exit !found }' /proc/net/if_inet6 2>/dev/null; then
            pod_ipv6=1
          fi
          reachable() {
            awk -v pod_ipv6="$pod_ipv6" '
              function ipv4(s, oct,    p, i) {
                if (split(s, p, /\./) != 4) return 0
                for (i = 1; i <= 4; i++) {
                  if (p[i] !~ /^[0-9]+$/ || (length(p[i]) > 1 && substr(p[i], 1, 1) == "0") || p[i] + 0 > 255) return 0
                  oct[i] = p[i] + 0
                }
                return 1
              }
              function hex(s,    i, n, digit) {
                if (length(s) < 1 || length(s) > 4 || s !~ /^[0-9a-fA-F]+$/) return -1
                s = tolower(s); n = 0
                for (i = 1; i <= length(s); i++) {
                  digit = index("0123456789abcdef", substr(s, i, 1)) - 1
                  n = n * 16 + digit
                }
                return n
              }
              function ipv6(s, groups,    zone, tail, oct, halves, left, right, nl, nr, i, n, p, tmp) {
                if (index(s, "%")) {
                  if (split(s, zone, /%/) != 2 || zone[2] == "") return 0
                  s = zone[1]
                }
                if (index(s, ".")) {
                  if (!match(s, /[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/) || RSTART <= 1 || substr(s, RSTART - 1, 1) != ":") return 0
                  tail = substr(s, RSTART)
                  if (!ipv4(tail, oct)) return 0
                  s = substr(s, 1, RSTART - 1) sprintf("%x:%x", oct[1] * 256 + oct[2], oct[3] * 256 + oct[4])
                }
                if (s !~ /^[0-9a-fA-F:]+$/) return 0
                if (index(s, "::")) {
                  tmp = s
                  if (gsub(/::/, "", tmp) != 1) return 0
                  split(s, halves, /::/)
                  nl = halves[1] == "" ? 0 : split(halves[1], left, /:/)
                  nr = halves[2] == "" ? 0 : split(halves[2], right, /:/)
                  if (nl + nr >= 8) return 0
                  n = 0
                  for (i = 1; i <= nl; i++) groups[++n] = hex(left[i])
                  while (n < 8 - nr) groups[++n] = 0
                  for (i = 1; i <= nr; i++) groups[++n] = hex(right[i])
                } else {
                  if (split(s, p, /:/) != 8) return 0
                  for (i = 1; i <= 8; i++) groups[i] = hex(p[i])
                }
                for (i = 1; i <= 8; i++) if (groups[i] < 0) return 0
                return 1
              }
              function usable(s,    oct, groups, i, zero, mapped, a, b, c, d) {
                if (!index(s, ":")) {
                  if (!ipv4(s, oct)) return 0
                  return oct[1] != 127 && !(oct[1] == 0 && oct[2] == 0 && oct[3] == 0 && oct[4] == 0)
                }
                if (!ipv6(s, groups)) return 0
                zero = 1
                for (i = 1; i <= 5; i++) if (groups[i] != 0) zero = 0
                mapped = zero && groups[6] == 65535
                if (mapped) {
                  a = int(groups[7] / 256); b = groups[7] % 256
                  c = int(groups[8] / 256); d = groups[8] % 256
                  return a != 127 && !(a == 0 && b == 0 && c == 0 && d == 0)
                }
                if (!pod_ipv6 || (groups[1] >= 65152 && groups[1] <= 65215)) return 0
                if (groups[6] != 0 || groups[7] != 0) zero = 0
                return !(zero && (groups[8] == 0 || groups[8] == 1))
              }
              $1 == "nameserver" && NF >= 2 && usable($2) { print "nameserver " $2 }
            ' "$1" 2>/dev/null || true
          }
          if grep -q '^nameserver' /node-dns/resolv.conf 2>/dev/null; then
            cp /node-dns/resolv.conf "$out"
            exit 0
          fi
          for src in /etc/resolv.conf /node-systemd-resolve/resolv.conf; do
            ns=$(reachable "$src")
            if [ -n "$ns" ]; then
              { echo "$ns"; keep "$src"; } > "$out"
              exit 0
            fi
          done
          echo "upstream-resolv: neither this node's /etc/resolv.conf nor its systemd-resolved names a nameserver a pod can reach; forwarding through 8.8.8.8 and 1.1.1.1 until the node writes its own choice" >&2
          { printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\n'; keep /etc/resolv.conf; } > "$out"
        volumeMounts:
        - name: node-dns
          mountPath: /node-dns
          readOnly: true
        - name: node-systemd-resolve
          mountPath: /node-systemd-resolve
          readOnly: true
        - name: upstream
          mountPath: /upstream
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
      containers:
      - name: coredns
        image: __STRATUM_REGISTRY__/coredns:__STRATUM_COREDNS_VERSION__
        args: ["-conf", "/etc/coredns/Corefile"]
        volumeMounts:
        - name: config-volume
          mountPath: /etc/coredns
          readOnly: true
        - name: upstream
          mountPath: /etc/coredns-upstream
          readOnly: true
        ports:
        - containerPort: 53
          name: dns
          protocol: UDP
        - containerPort: 53
          name: dns-tcp
          protocol: TCP
        - containerPort: 9153
          name: metrics
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 8181
            scheme: HTTP
        # Sized for retained container logs, which count as ephemeral storage.
        # It only sizes the pod's footprint; the priority class above is the
        # protection. No limit: exceeding one would evict the pod.
        resources:
          requests:
            ephemeral-storage: 64Mi
      dnsPolicy: Default
      volumes:
      - name: config-volume
        configMap:
          name: coredns
          items:
          - key: Corefile
            path: Corefile
      - name: node-dns
        hostPath:
          path: /var/lib/stratum/dns
          type: DirectoryOrCreate
      - name: node-systemd-resolve
        hostPath:
          path: /run/systemd/resolve
          type: DirectoryOrCreate
      - name: upstream
        emptyDir:
          sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kube-dns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    kubernetes.io/name: CoreDNS
spec:
  selector:
    k8s-app: kube-dns
  clusterIP: __STRATUM_DNS_IP__
  ports:
  - name: dns
    port: 53
    protocol: UDP
  - name: dns-tcp
    port: 53
    protocol: TCP
  - name: metrics
    port: 9153
    protocol: TCP
