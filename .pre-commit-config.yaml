# pre-commit gates for ctrliq/stratum. See https://pre-commit.com
#
# Two stages on purpose. Anything on `pre-commit` must be fast enough to run on
# every commit; anything that builds or reads the whole tree runs on `pre-push`.
# `make test` is deliberately in neither — it is a CI gate, and putting it here
# would make routine commits unusable.
#
# Enable every stage once per clone:
#   pre-commit install

# Generated and vendored trees are excluded, not tidied. internal/addons/
# manifests/cilium-kpr-true.yaml says "Generated by tools/gen-cilium-manifest.sh
# -- DO NOT EDIT BY HAND", and the whitespace hooks rewrote 13 places inside the
# Helm output it embeds; the next regeneration would put every one of them back.
exclude: |
  (?x)^(
    vendor/|
    dash/dist/|
    dash/node_modules/|
    dash/public/|
    internal/addons/manifests/|
    \.envtest/|
    docs/themes/|
    .*/testdata/
  )

default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit, pre-push]
      - id: end-of-file-fixer
        stages: [pre-commit, pre-push]
      - id: check-merge-conflict
        stages: [pre-commit, pre-push]
      - id: check-json
        # ske-search/data.json is a Hugo template that EMITS json; it opens
        # with {{- /* ... */}} and is not itself parseable.
        exclude: '^docs/assets/ske-search/data\.json$'
        stages: [pre-commit, pre-push]
      - id: detect-private-key
        stages: [pre-commit, pre-push]
      # check-yaml is deliberately absent: the addon manifests carry
      # substitution sentinels and templated values that a strict parser
      # rejects.

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        description: >
          gofmt is a gate in `make test`, so catch it before CI does. The
          missing-tool check is not ceremony: without it the command
          substitution fails, out is empty, and the hook reports success --
          the same gap tools/lint-shell.sh calls out for shellcheck.
        entry: bash -c 'command -v gofmt >/dev/null || { echo "gofmt not found" >&2; exit 1; }; out=$(gofmt -l "$@") || exit 1; [ -z "$out" ] || { echo "not formatted:"; echo "$out"; exit 1; }' --
        language: system
        types: [go]
        stages: [pre-commit, pre-push]

      - id: lint-versions
        name: lint-versions (one place for every third-party version)
        entry: tools/lint-versions.sh
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: lint-docs-cli
        name: lint-docs-cli (documented verbs and flags exist)
        entry: tools/lint-docs-cli.sh
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: lint-shell
        name: lint-shell (bash -n + shellcheck, the repo gate)
        description: >
          tools/lint-shell.sh, not a hand-rolled shellcheck. It is stricter and more
          correct than a bare shellcheck call: --norc so a personal ~/.shellcheckrc
          cannot pass what CI rejects, -S style with SC1091 excluded rather
          than -S error, bash -n under both the 3.2 floor and 5.x, and
          git ls-files rather than a list a new script can fall out of.
        entry: tools/lint-shell.sh
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      # --- pre-push only: these build, or read the whole tree ---

      - id: go-vet
        name: go vet (pinned toolchain, noui)
        description: >
          -tags noui because the untagged build embeds dash/dist, which a clean
          clone has not built. The toolchain is read from build/versions.mk
          rather than written here, which lint-versions.sh would reject.
        entry: bash -c 'GOTOOLCHAIN=go$(sed -n "s/^go_version *= *//p" build/versions.mk) go vet -tags noui ./...'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: check-cli-api-boundary
        name: check-cli-api-boundary (pkg/cli exports no internal types)
        entry: tools/check-cli-api-boundary.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: check-signoff
        name: check-signoff (the message carries your Signed-off-by)
        entry: tools/check-signoff.sh --message
        language: system
        stages: [commit-msg]

      # The whole lint gate list, handed to the Makefile: pre-push runs the
      # same target the CI lint job runs, so a gate registered in the one
      # list cannot be missing from the other — the gatelist self-tests in
      # tools/gatelist hold the two together, and it tolerates an exit-3
      # rate-limited network gate exactly as CI does.
      # Hooks export repository-local Git variables. Clear them before lint's
      # fixture repos run, so their git commands cannot touch this index.
      - id: make-lint
        name: make lint (the one gate list)
        entry: bash -c 'for name in $(git rev-parse --local-env-vars); do unset "$name"; done; make lint'
        language: system
        pass_filenames: false
        stages: [pre-push]
