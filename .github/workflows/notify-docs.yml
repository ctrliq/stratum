name: Notify docs site of release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify-docs:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    steps:
      - name: Dispatch stratum-release to docs repo
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          jq -n --arg tag "$TAG" \
            '{event_type: "stratum-release", client_payload: {tag: $tag}}' \
            | gh api -X POST repos/ctrliq/docs.ciq.com/dispatches --input -
