name: weekly

# The slow suites that do not fit a night: the full e2e conformance matrix on
# real infrastructure, and the kubelet skew extremes.
#
# ostests: branch x provider x arch (tools/ostests/matrix.sh) — three
# branches on GCP — and every leg is ~3 hours of a five-node cluster, at
# max-parallel 2. Weekly gives that room. The leaked-resource sweeper stays
# nightly: a leaked cluster costs by the day, and the sweep is cheap.
#
# ostests runs conformance with run-conformance.sh (hydrophone at
# --mode=certified-conformance).
on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branches:
    runs-on: ubuntu-latest
    outputs:
      ostests: ${{ steps.ostests.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The ostests legs come from a generator rather than a matrix block, one
      # source shared with release.yml and the nightly sweep.
      # tools/ostests/matrix.sh has the reasoning (and reads
      # build/branches.txt, the same source of truth as the fences);
      # tools/test-ostests-matrix.sh pins the GCP legs to what ran live.
      - id: ostests
        run: echo "matrix=$(tools/ostests/matrix.sh weekly)" >> "$GITHUB_OUTPUT"

  ostests:
    # Provisions real GCP clusters via provision.sh. The release-branch legs
    # fail at the hydrophone install step until the pins are backported.
    needs: branches
    if: vars.OSTESTS_ENABLED == 'true'
    strategy:
      fail-fast: false
      # 5 instances x 4 vCPUs x every leg, all ephemeral external IPs, in ONE
      # shared GCP project. Uncapped, 3 branches x 2 arches is 30 instances /
      # 120 vCPUs / 30 in-use IPs at once — over the default regional in-use-IP
      # quota (8) before the second leg starts. Two legs at a time keeps the
      # footprint inside a small quota bump and out of other teams' way. A week
      # has room for that; a night did not.
      max-parallel: 2
      # branch x provider x arch, one OS row per provider, generated by
      # tools/ostests/matrix.sh (see the branches job). Every leg carries
      # branch, provider, os, image, goarch and runner.
      # The whole {"include":[...]} object from matrix.sh is the matrix (see
      # release.yml); nested under include: the job silently never ran.
      matrix: ${{ fromJSON(needs.branches.outputs.ostests) }}
    runs-on: ${{ matrix.runner }}
    # Provisioning can legitimately take ~40m (600s per serial controller join
    # plus a 10m Ready loop) and certified-conformance up to 4h. Without a cap
    # the job can hit GitHub's 6h kill, and a killed job runs NO further steps —
    # including the always() teardown, so the platform limit would leak the
    # cluster with no cleanup even attempted. 330m leaves teardown room.
    timeout-minutes: 330
    env:
      # Distinct per leg via strategy.job-index. The matrix is branch x provider
      # x arch, so without it the branch legs of a given (provider, arch) would
      # share one CLUSTER_NAME — one Pulumi stack, one set of resource names —
      # and each leg's teardown would destroy whichever cluster won the race.
      # The numeric index rather than the branch name because branch names
      # carry dots and slashes, which GCP resource names forbid; the run's
      # matrix maps the index back to its branch. The provider is in the name
      # so a leaked cluster says where it lives.
      CLUSTER_NAME: ske-${{ github.run_id }}-${{ strategy.job-index }}-${{ matrix.provider }}-${{ matrix.os }}-${{ matrix.goarch }}
      ARCH: ${{ matrix.goarch }}
      # The matrix must export an image for each row or the OS dimension is
      # silently inert — adding a row would change nothing.
      OS_IMAGE: ${{ matrix.image }}
      PROVISION_BACKEND: ${{ matrix.provider }}
      PROVIDER: ${{ matrix.provider }}
      GCP_PROJECT: ${{ vars.OSTESTS_GCP_PROJECT }}
      GCP_ZONE: ${{ vars.OSTESTS_GCP_ZONE }}
      # PULUMI_BACKEND_URL is set per provider by the "provider settings" step
      # below. Self-managed state: Pulumi requires a backend where OpenTofu
      # defaulted to a local file, and a runner that dies mid-job would
      # otherwise take the state with it and orphan the whole cluster.
    permissions:
      contents: read
      id-token: write        # Workload Identity Federation
      packages: read         # ghcr login below — pull the mirrored images
    steps:
      # Keep the workflow's provisioning harness at the ref that defines this
      # workflow. Release branches can predate the harness; requiring every
      # harness change to be backported would make an otherwise valid release
      # branch fail before it can be tested.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: '${{ matrix.branch }}', path: .branch-src }
      - uses: ./.github/actions/runner-prep
      # Node + pnpm: `make package` builds the SPA the Go build embeds. Beside
      # runner-prep rather than inside it — see that action's header for why.
      #
      # The pins come from .branch-src, not from the workspace root: this job
      # packages matrix.branch out of there, and a release branch that predates
      # the dashboard pins neither version — so the action installs nothing and
      # the leg keeps building with `TAGS ?= noui` and no npm dependency at all.
      - uses: ./.github/actions/node-prep
        with:
          manifest: .branch-src/build/versions.mk
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7

      # If OS_IMAGE resolves to empty the backend silently falls back to its
      # per-arch defaults, which are arch-CORRECT, so nothing breaks and nothing
      # complains, and the OS dimension is quietly inert. Assert rather than
      # trust — the matrix test guards the generator, this guards the wiring.
      - name: assert the OS matrix resolved
        run: |
          test -n "$OS_IMAGE" || {
            echo "::error::OS_IMAGE is empty — the os matrix entry did not resolve" \
                 "for arch=$ARCH. The OS dimension would silently fall back to defaults."
            exit 1
          }
          echo "OS_IMAGE=$OS_IMAGE"

      # One state bucket per cloud: a job's credentials reach exactly one, and
      # the backend refuses any other scheme (backends/ssh-lib.sh). Resolved in
      # shell rather than a chain of `&&`/`||` expressions so that an unset
      # variable fails HERE, by name, instead of quietly selecting another
      # provider's bucket for the expression to fall through to.
      - name: provider settings
        env:
          GCP_URL: ${{ vars.OSTESTS_PULUMI_BACKEND_URL }}
        run: |
          case "$PROVIDER" in
            gcp)   url=$GCP_URL;   var=OSTESTS_PULUMI_BACKEND_URL ;;
            *)     echo "::error::unknown provider '$PROVIDER'"; exit 1 ;;
          esac
          [ -n "$url" ] || { echo "::error::no Pulumi state URL configured for $PROVIDER — set the $var repository variable"; exit 1; }
          echo "PULUMI_BACKEND_URL=$url" >> "$GITHUB_ENV"

      # The backend requires a keypair (it uploads the public half via instance
      # metadata), and hosted runners have none. Per-run and throwaway — the
      # instances live for one job.
      - name: generate an ssh keypair
        run: test -f ~/.ssh/id_ed25519 || ssh-keygen -t ed25519 -N '' -q -f ~/.ssh/id_ed25519

      # `make images` pulls the MIRRORED refs and, on a 401, takes the
      # Makefile's upstream fallback with only a log line. The cluster built
      # either way is byte-identical (digest-pinned), but an unauthenticated
      # build quietly stops exercising the mirror this repo certifies against —
      # release.yml logs in for exactly this reason, so this job does too.
      - run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # provision.sh installs the packaged artifact across the nodes, so it has
      # to exist — and `make package` alone does not build it: its own recipe
      # exits 1 pointing at `make components` first. Same order as release.yml,
      # with TARGET_ARCH so the artifact matches the runner and the nodes.
      # Built from matrix.branch — which is the point of the per-branch matrix:
      # "it passes on main" says nothing about release-1.35.
      - name: build the artifact
        working-directory: .branch-src
        run: |
          make components TARGET_ARCH=${{ matrix.goarch }}
          make images     TARGET_ARCH=${{ matrix.goarch }}
          make package    TARGET_ARCH=${{ matrix.goarch }}

      # run-conformance.sh hard-exits if hydrophone is absent, so without this the
      # job dies after provisioning a five-node cluster and before producing any
      # evidence — paying for the infrastructure and learning nothing.
      #
      # Pinned from build/versions.mk like every other component, and installed
      # the same way release.yml does it. Arch-templated: this runner is the
      # cluster's architecture.
      - name: install hydrophone
        run: |
          set -euo pipefail
          a=${{ matrix.goarch }}
          # BOTH lookups before the download, each guarded, and fail closed but
          # legibly: this reads the CHECKED-OUT branch's versions.mk, and a
          # release branch that predates these pins has NEITHER key. An empty
          # version would build a malformed URL and die as a baffling curl 404
          # before any guard placed after the download could speak; an empty
          # digest would surface as a sha256sum format error. Name the actual
          # fix (backport the pins) in both cases.
          v=$(sed -n 's/^hydrophone_version *= *//p' .branch-src/build/versions.mk | tr -d ' ')
          [ -n "$v" ] || { echo "::error::no hydrophone_version in this branch's versions.mk — backport the hydrophone pins"; exit 1; }
          want=$(sed -n "s/^hydrophone_sha256_linux_${a} *= *//p" .branch-src/build/versions.mk | tr -d ' ')
          [ -n "$want" ] || { echo "::error::no hydrophone_sha256_linux_${a} pin in this branch's versions.mk — backport the digest pins"; exit 1; }
          # Upstream names its x86-64 asset x86_64, not amd64.
          asset=hydrophone_Linux_$([ "$a" = amd64 ] && echo x86_64 || echo "$a").tar.gz
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/hydrophone.tgz" \
            "https://github.com/kubernetes-sigs/hydrophone/releases/download/v$v/$asset"
          # Digest-checked before a root-privileged extract onto PATH: TLS
          # authenticates the channel, not the artifact, and this repo cosigns
          # its own checksums — an unverified third-party binary here would be
          # below its own bar. Pins live beside hydrophone_version in versions.mk.
          echo "$want  $RUNNER_TEMP/hydrophone.tgz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin hydrophone < "$RUNNER_TEMP/hydrophone.tgz"

      # Workload Identity Federation rather than a long-lived service-account
      # key — minted HERE, after the branch's own build has already run: the
      # build executes every makefile and Dockerfile on that branch and needs no
      # cloud access, so the federated identity should not exist yet while it
      # runs. The provider and service account are the parts that cannot be
      # committed; set them alongside OSTESTS_ENABLED.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: matrix.provider == 'gcp'
        with:
          workload_identity_provider: ${{ vars.OSTESTS_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.OSTESTS_GCP_SERVICE_ACCOUNT }}

      # provision.sh owns `pulumi up`: its contract takes the provisioning inputs
      # and says the caller only destroys. The Pulumi passphrase is step-scoped —
      # the build steps above must not see it.
      - name: e2e
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.OSTESTS_PULUMI_PASSPHRASE }}
        run: tools/ostests/run-suite.sh "$GITHUB_WORKSPACE/.branch-src/dist/stratum"

      # The results tarball and summary are the entire point of the run —
      # run-conformance.sh's own comment says a failing run's list of failed
      # tests is why it exists. always(), so a red leg still leaves evidence.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: conformance-${{ strategy.job-index }}-${{ matrix.provider }}-${{ matrix.os }}-${{ matrix.goarch }}
          path: _output/conformance/
          if-no-files-found: ignore

      # Re-mint the federated credential for teardown: WIF access tokens live
      # about an hour and certified-conformance runs about four, so the token
      # from the auth step above is long dead by now — and the credential file
      # it wrote cannot self-refresh, because the GitHub OIDC token inside it
      # expired with it. The job's id-token permission is valid for its whole
      # life, so minting again here works. always(): teardown runs on failure
      # and cancel, so the auth it depends on must too.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: always() && matrix.provider == 'gcp'
        with:
          workload_identity_provider: ${{ vars.OSTESTS_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.OSTESTS_GCP_SERVICE_ACCOUNT }}

      - name: teardown
        # always(), so a failed or cancelled run still destroys. While nightly's
        # sweep job stays gated off, this is the ONLY automated
        # cleanup: a run GitHub kills outright — platform timeout, runner loss —
        # leaks the cluster, findable by the ske-cluster label on instances
        # and, since GCP forbids labels there, by EXACT name on the
        # network ($CLUSTER_NAME) and its two firewalls ($CLUSTER_NAME-internal
        # and -ssh). Exact, never a prefix: that is what tools/ostests/sweep.sh
        # matches, because this project is shared and a $CLUSTER_NAME-prefixed
        # resource that is not one of those three belongs to someone else.
        #
        # --remove drops the stack after destroying it; without it the stacks
        # accumulate in the state bucket forever, one per run per leg.
        if: always()
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.OSTESTS_PULUMI_PASSPHRASE }}
        run: |
          set -uo pipefail
          # Guarded: an unguarded cd here would run `pulumi destroy` from the
          # repository root, where there is no Pulumi program, and report that as
          # a successful teardown.
          # Each provider's program is its own Pulumi project: its own
          # directory under tools/ostests/, its own state bucket.
          cd "tools/ostests/$PROVIDER" || { echo "::error::tools/ostests/$PROVIDER missing — cannot run teardown"; exit 1; }

          # `stack select || exit 0` treats every failure as "nothing to
          # destroy": an unreachable state backend or expired credentials
          # would skip teardown silently and leak all five instances, the
          # network and both firewall rules — while the step reports success.
          # So distinguish the two. A backend we cannot reach is a loud
          # failure; a stack that genuinely does not exist is not.
          if ! stacks=$(pulumi stack ls --json 2>&1); then
            echo "::error::cannot reach the Pulumi backend, so teardown could not run." \
                 "Resources may be leaked — instances carry label/tag ske-cluster=$CLUSTER_NAME." \
                 "On gcp the network and firewall rules carry no labels (GCP does not allow them there)," \
                 "so find them by exact name: network $CLUSTER_NAME, firewalls" \
                 "$CLUSTER_NAME-internal and $CLUSTER_NAME-ssh. Do not delete by prefix —" \
                 "that project is shared. Elsewhere the VPC / resource group / VCN is named $CLUSTER_NAME."
            echo "$stacks"
            exit 1
          fi

          if ! grep -q "\"name\": *\"$CLUSTER_NAME\"" <<<"$stacks"; then
            echo "no stack '$CLUSTER_NAME' — provisioning did not get far enough to create one"
            exit 0
          fi

          # Checked, not chained past. Without -e a failed select leaves whatever
          # stack was already selected in place, and the destroy below would run
          # against THAT — on a self-hosted runner carrying prior state, another
          # cluster. Failing here leaks this cluster, which is recoverable; the
          # alternative destroys someone else's, which is not. --stack on the
          # destroy as well, so it names its target even if the selection lied.
          if ! pulumi stack select "$CLUSTER_NAME"; then
            echo "::error::could not select stack '$CLUSTER_NAME', so nothing was destroyed." \
                 "This cluster is leaked — see the label/tag and names above"
            exit 1
          fi
          pulumi destroy --yes --non-interactive --remove --stack "$CLUSTER_NAME"

  skew-extremes:
    # kubelet at the maximum supported skew behind the apiserver. Most
    # distributions test n-1 only; the documented envelope is 3 minors, and the
    # extreme is where it breaks.
    #
    # run-skew.sh is a real driver: it provisions a cluster, drops
    # one worker's kubelet to the pinned N-3 upstream build, and fails unless
    # that node registers, gets scheduled to, and runs a pod. The apparatus below
    # mirrors the ostests job above, because this job provisions the same way.
    #
    # Gated on OSTESTS_WEEKLY_ENABLED, which is off: flipping it
    # is the last step, once a supervised run confirms the driver against real
    # infrastructure.
    if: vars.OSTESTS_WEEKLY_ENABLED == 'true'
    # One arch, one branch, deliberately. Version skew is a property of the
    # Kubernetes API surface, not of the instruction set or the OS image, and the
    # ostests job above already covers arch x OS against the same provisioner. Per-branch
    # would not work anyway: release branches keep these scripts under hack/, so
    # tools/ostests/run-skew.sh does not exist there (see the conformance job).
    runs-on: ubuntu-latest
    # Provisioning can legitimately take ~40m; the swap, the re-registration and
    # the pod probe are minutes. Capped well under GitHub's 6h kill, which runs
    # NO further steps — an uncapped job that hits it leaks the cluster with
    # teardown never attempted.
    timeout-minutes: 120
    env:
      CLUSTER_NAME: ske-skew-${{ github.run_id }}
      ARCH: amd64
      OS_IMAGE: rocky-linux-cloud/rocky-linux-9
      GCP_PROJECT: ${{ vars.OSTESTS_GCP_PROJECT }}
      GCP_ZONE: ${{ vars.OSTESTS_GCP_ZONE }}
      # Must be a gs:// URL — the job's only cloud credentials are the GCP WIF
      # ones below (see the ostests job above for the full rationale). The
      # Pulumi passphrase is deliberately NOT here: it is step-scoped to the two
      # steps that run pulumi.
      PULUMI_BACKEND_URL: ${{ vars.OSTESTS_PULUMI_BACKEND_URL }}
    permissions:
      contents: read
      id-token: write        # Workload Identity Federation
      packages: read         # ghcr login below — pull the mirrored images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/runner-prep
      # Node + pnpm: `make package` builds the SPA the Go build embeds. Beside
      # runner-prep rather than inside it — see that action's header for why.
      #
      # Workspace manifest, i.e. the default: unlike `ostests` above, this job
      # has one checkout and packages the workspace itself. Pointing it at
      # .branch-src would find no manifest, install nothing, and fail in
      # `make dash`.
      - uses: ./.github/actions/node-prep
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7

      # The backend requires a keypair (it uploads the public half via instance
      # metadata), and hosted runners have none. Per-run and throwaway.
      - name: generate an ssh keypair
        run: test -f ~/.ssh/id_ed25519 || ssh-keygen -t ed25519 -N '' -q -f ~/.ssh/id_ed25519

      # `make images` pulls the MIRRORED refs and, on a 401, takes the
      # Makefile's upstream fallback with only a log line. Same reason the
      # ostests job logs in: an unauthenticated build quietly stops exercising the
      # mirror this repo certifies against.
      - run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # provision.sh installs the packaged artifact across the nodes, so it has
      # to exist — and `make package` alone does not build it: its own recipe
      # exits 1 pointing at `make components` first.
      - name: build the artifact
        run: |
          make components TARGET_ARCH=$ARCH
          make images     TARGET_ARCH=$ARCH
          make package    TARGET_ARCH=$ARCH

      # run-skew.sh runs its assertions and its pod probe from the runner through
      # provision.sh's kubeconfig, and hard-exits if kubectl is absent — before
      # provisioning, so a missing client costs nothing. The artifact's own
      # kubectl rather than a download: it is the build under test, pinned by
      # construction, and needs no third-party digest to keep current.
      - name: install the artifact's kubectl
        run: |
          set -euo pipefail
          dist/stratum stage --root "$RUNNER_TEMP/stage" >/dev/null
          sudo install -m0755 "$RUNNER_TEMP/stage/bin/kubectl" /usr/local/bin/kubectl
          # Dropped straight away: staging extracts the whole payload, and the
          # image tar in it is ~1.2G on a runner that starts with ~14G free and
          # is already carrying the artifact and the staging tar.
          rm -rf "$RUNNER_TEMP/stage"
          kubectl version --client

      # Minted AFTER the build and the third-party staging above: those need no
      # cloud access, so the federated identity should not exist yet while they
      # run. Same principle as the ostests job above.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.OSTESTS_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.OSTESTS_GCP_SERVICE_ACCOUNT }}

      # The passphrase is here because provision.sh, which this step invokes,
      # owns `pulumi up` — its contract takes the provisioning inputs and leaves
      # destroying to the caller. run-skew.sh makes no pulumi call of its own:
      # it reads the node list from provision.sh's $OUT/nodes rather than
      # re-running backend_up, which is destructive on the local backend.
      - name: skew
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.OSTESTS_PULUMI_PASSPHRASE }}
        run: tools/ostests/run-skew.sh dist/stratum

      # report.txt is the only record of the versions and the probe verdict
      # that outlives this log — run-skew.sh writes it on both the pass and
      # the fail path, and fails the run itself if it can't. error, not
      # ignore: a missing file here means the write failed silently on the
      # runner in a way run-skew.sh's own exit status didn't catch, and that
      # is a CI finding, not something to shrug off. always(), so a failing
      # run keeps its evidence too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: skew-${{ github.run_id }}
          path: _output/skew/report.txt
          if-no-files-found: error

      # Re-mint the federated credential for teardown: WIF access tokens live
      # about an hour and this job can run longer. always(): teardown runs on
      # failure and cancel, so the auth it depends on must too.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: always()
        with:
          workload_identity_provider: ${{ vars.OSTESTS_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.OSTESTS_GCP_SERVICE_ACCOUNT }}

      - name: teardown
        # always(), so a failed or cancelled run still destroys — run-skew.sh
        # deliberately does not clean up after itself (see provision.sh), which
        # is what leaves a failing skew run inspectable.
        #
        # Same structure as the ostests job's teardown, and for its reasons: an
        # unreachable backend fails loudly, a genuinely absent stack does not,
        # and --remove keeps the state bucket from accumulating one stack per
        # Sunday.
        if: always()
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.OSTESTS_PULUMI_PASSPHRASE }}
        run: |
          set -uo pipefail
          cd tools/ostests/gcp || { echo "::error::tools/ostests/gcp missing — cannot run teardown"; exit 1; }

          if ! stacks=$(pulumi stack ls --json 2>&1); then
            echo "::error::cannot reach the Pulumi backend, so teardown could not run." \
                 "Resources may be leaked — instances carry label ske-cluster=$CLUSTER_NAME;" \
                 "the network and firewall rules carry no labels (GCP does not allow them there)," \
                 "so find them by exact name: network $CLUSTER_NAME, firewalls" \
                 "$CLUSTER_NAME-internal and $CLUSTER_NAME-ssh. Do not delete by prefix —" \
                 "this project is shared"
            echo "$stacks"
            exit 1
          fi

          if ! grep -q "\"name\": *\"$CLUSTER_NAME\"" <<<"$stacks"; then
            echo "no stack '$CLUSTER_NAME' — provisioning did not get far enough to create one"
            exit 0
          fi

          # Checked, not chained past. Without -e a failed select leaves whatever
          # stack was already selected in place, and the destroy below would run
          # against THAT — on a self-hosted runner carrying prior state, another
          # cluster. Failing here leaks this cluster, which is recoverable; the
          # alternative destroys someone else's, which is not.
          if ! pulumi stack select "$CLUSTER_NAME"; then
            echo "::error::could not select stack '$CLUSTER_NAME', so nothing was destroyed." \
                 "This cluster is leaked — see the label and exact names above"
            exit 1
          fi
          pulumi destroy --yes --non-interactive --remove
